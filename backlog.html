<title>Backlog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  color-scheme:dark;
  --bg:#0b0b0d; --surface:#131316; --surface-2:#1a1a1e; --surface-3:#232328; --hover:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8a8984;
  --accent:#f43f5e; --accent-2:#ff5b77; --accent-soft:rgba(244,63,94,.14); --accent-line:rgba(244,63,94,.55);
  --t-filme:#c45ee8; --t-game:#a1a1aa; --t-livro:#2fc163; --t-serie:#f04646; --t-doc:#fb7a35;
  --t-anime:#f5a524; --t-video:#4f8ff7; --t-teatro:#f472b6; --t-outro:#8a8984;
  --s-fila:#a1a1aa; --s-andamento:#38bdf8; --s-concluido:#22c55e; --s-dropado:#fb923c;
  --star:#facc15; --companhia:#ff4d6d; --destaque:rgba(251,207,214,.16); --destaque-line:rgba(251,207,214,.55);
  --good:#4ade80; --bad:#f87171; --link:#38bdf8;
  --grid:#2c2c2a; --axis:#383835;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --radius:10px; --chrome-h:150px; --zoom:1;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f4f1; --surface:#ffffff; --surface-2:#f7f7f5; --surface-3:#ececea; --hover:rgba(0,0,0,.03);
  --line:rgba(11,11,11,.08); --line-2:rgba(11,11,11,.15);
  --ink:#121212; --ink-2:#4a4945; --muted:#77756f;
  --accent:#e11d48; --accent-2:#be123c; --accent-soft:rgba(225,29,72,.09); --accent-line:rgba(225,29,72,.5);
  --t-filme:#a21caf; --t-game:#63636b; --t-livro:#15803d; --t-serie:#dc2626; --t-doc:#ea580c;
  --t-anime:#b45309; --t-video:#2563eb; --t-teatro:#db2777; --t-outro:#77756f;
  --s-fila:#71717a; --s-andamento:#0284c7; --s-concluido:#15803d; --s-dropado:#ea580c;
  --star:#ca8a04; --companhia:#e11d48; --destaque:rgba(244,114,182,.16); --destaque-line:rgba(219,39,119,.45);
  --good:#15803d; --bad:#dc2626; --link:#0369a1;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 18px 50px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
svg.i{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::selection{background:var(--accent-soft)}

/* ---------- chrome (cabeçalho + filtros) ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
#chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding:10px var(--gr) 10px var(--gl)}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:11.5px}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.search:focus-within{border-color:var(--line-2);color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
kbd{font:600 10.5px/1 Inter,system-ui,sans-serif;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:3px 6px}
.spacer{flex:1}
.status-chip{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:11.5px;white-space:nowrap}
.status-chip:hover{background:var(--surface-2);border-color:var(--line)}
.status-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--s-dropado)}
.status-chip.ok .dot{background:var(--s-concluido)}
.status-chip.info .dot{background:var(--s-andamento)}
.status-chip.err .dot{background:var(--bad)}
.status-chip.busy .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.seg{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{display:flex;align-items:center;gap:6px;height:26px;padding:0 11px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:600;font-size:12px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface-3);color:var(--ink);box-shadow:0 1px 0 var(--line-2) inset}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:transparent}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.btn.ghost{background:transparent}
.btn.icon{width:32px;padding:0}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}

.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:2px var(--gr) 8px var(--gl)}
.filters::-webkit-scrollbar{height:4px}
.flabel{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.year{display:flex;align-items:center;gap:8px;flex:none}
.year select{height:30px;border-radius:8px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--ink);font-weight:700;padding:0 8px;outline:0}
.year select option{background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:4px;flex:none;padding:3px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.chip{display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.chip:hover{background:var(--hover);color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip span{color:var(--muted);font-weight:500}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.chip:disabled{opacity:.35;cursor:default}
.check{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;flex:none}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.zoom{display:flex;align-items:center;gap:7px;color:var(--muted);flex:none;margin-left:auto}
.zoom input{width:110px;accent-color:var(--accent)}
.kpis{display:flex;gap:26px;padding:0 var(--gr) 10px var(--gl);align-items:flex-end}
.kpi b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.kpi small{font-size:9.5px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
body.v-dashboard .kpis,body.v-dashboard .zoom{display:none}

main{padding:0 0 60px}
.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* ---------- etiquetas comuns ---------- */
.ttag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;color:var(--tc);white-space:nowrap}
.ttag i{width:7px;height:7px;border-radius:2px;background:var(--tc);flex:none}
.spill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;color:var(--sc);background:color-mix(in srgb,var(--sc) 13%,transparent);border:1px solid color-mix(in srgb,var(--sc) 38%,transparent)}
.spill i{width:6px;height:6px;border-radius:50%;background:var(--sc)}
.st-fila{--sc:var(--s-fila)} .st-andamento{--sc:var(--s-andamento)} .st-concluido{--sc:var(--s-concluido)} .st-dropado{--sc:var(--s-dropado)}
.ppill{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-3);color:var(--ink-2);font-size:11px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.noinfo{color:var(--muted);font-style:italic;font-size:11px}
.star{color:var(--ink);font-weight:700;white-space:nowrap}
.star::before{content:"★";color:var(--star);margin-right:4px}
.rb{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:5px;border:1px solid var(--line-2);font-size:11px;font-weight:700;white-space:nowrap;background:var(--surface-2)}
.rb small{font-size:9px;font-weight:600;color:var(--muted)}
.rb.hi{border-color:color-mix(in srgb,var(--good) 55%,transparent);color:var(--good)}
.rb.lo{border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.rtext{color:var(--muted);font-style:italic;font-size:11.5px}
.autolink{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline dashed color-mix(in srgb,var(--ink-2) 45%,transparent);text-underline-offset:3px;text-align:inherit;font-size:12px}
.autolink:hover{color:var(--ink)}
.autodot{position:relative}
.autodot::after{content:"";position:absolute;top:6px;left:50%;width:5px;height:5px;border-radius:50%;background:var(--link);transform:translateX(-50%)}
.comp-ic{display:inline-block;vertical-align:-2px;margin-left:5px;color:var(--companhia)}

/* ---------- cabeçalho de mês ---------- */
.mhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px;padding:22px var(--gr) 12px var(--gl)}
.mhead h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.mhead h3 small{font-size:15px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.mstats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.mstats .dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:0}
.mstats .okc{color:var(--s-concluido)}

/* ---------- planilha ---------- */
.tablewrap{overflow-x:clip}
@media (max-width:1240px){.tablewrap{overflow-x:auto}table.sheet thead th{position:static}}
table.sheet{width:100%;min-width:1180px;border-collapse:collapse}
table.sheet thead th{position:sticky;top:calc(var(--chrome-h) + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:9px 8px;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;white-space:nowrap;user-select:none}
table.sheet thead th[data-sort]{cursor:pointer}
table.sheet thead th[data-sort]:hover{color:var(--ink)}
table.sheet thead th.sorted{color:var(--accent)}
table.sheet td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle}
table.sheet tbody tr.r{cursor:pointer}
table.sheet tbody tr.r:hover td{background:var(--hover)}
table.sheet tr.m td{padding:0;border-bottom:1px solid var(--line);text-align:left;cursor:default}
td.c-n{width:calc(28px + var(--gl));padding-left:var(--gl)!important;color:var(--muted);font-size:10.5px;text-align:left;font-variant-numeric:tabular-nums}
td.c-cv{width:calc(44px*var(--zoom));padding:4px 6px}
td.c-cv img,td.c-cv .ph{width:calc(34px*var(--zoom));height:calc(50px*var(--zoom));border-radius:4px;object-fit:cover;margin:auto;background:var(--surface-2)}
td.c-cv img{display:block}
td.c-cv .ph{font-size:calc(11px*var(--zoom))}
td.c-tipo{width:120px}
td.c-nome{min-width:240px}
.nm{font-weight:600;color:var(--tc)}
.nm .sfx{font-weight:500;color:var(--muted);font-style:normal;font-size:11.5px;margin-left:4px}
.nm.comp{color:var(--companhia)}
.sub{font-size:11px;color:var(--muted);font-style:italic;margin-top:1px}
td.c-plat{width:110px}
td.c-ano{width:60px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
td.c-autor{min-width:200px;max-width:280px}
td.c-imdb{width:70px}
td.c-aval{width:120px}
td.c-status{width:126px}
td.c-date{width:112px;font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.dhl{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--destaque);box-shadow:0 0 0 1px var(--destaque-line) inset}
.ph{display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:.02em;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 70%,#000),color-mix(in srgb,var(--tc) 25%,#000));text-transform:uppercase;overflow:hidden}
.sentinel td{border:0;height:40px}

/* ---------- capas ---------- */
.cgroup{padding:0 var(--gr) 0 var(--gl)}
.cgroup .mhead{padding-left:14px;margin-left:-14px;border-left:3px solid var(--accent);margin-top:14px;padding-top:6px;padding-bottom:6px;margin-bottom:12px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(136px*var(--zoom)),1fr));gap:18px 14px}
.card{cursor:pointer;min-width:0}
.cv{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface-2);box-shadow:0 0 0 1px var(--line) inset;border-top:3px solid var(--tc)}
.cv img,.cv .ph{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.cv img{display:block}
.cv .ph{font-size:calc(30px*var(--zoom));padding:10px;text-align:center}
.card:hover .cv img{transform:scale(1.04)}
.cv .spill{position:absolute;top:7px;right:7px;height:20px;font-size:10px;background:color-mix(in srgb,#000 62%,transparent);backdrop-filter:blur(6px);color:#fff;border-color:color-mix(in srgb,var(--sc) 55%,transparent)}
.cv-b{position:absolute;left:6px;right:6px;bottom:6px;display:flex;flex-wrap:wrap;gap:4px}
.cv-b b{font-size:9.5px;font-weight:700;color:#fff;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);white-space:nowrap}
.cv-b b small{font-weight:600;opacity:.7;margin-right:3px;font-size:8.5px}
.card p{margin:0}
.card h4{margin:8px 0 0;font-size:12.5px;font-weight:700;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card h4.comp{color:var(--companhia)}
.card .sub{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:10.5px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

/* ---------- dashboard ---------- */
.dash{padding:16px var(--gr) 16px var(--gl);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.panelc{grid-column:span 12;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}
.ph-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.ph-head h3{margin:0;font-size:13.5px;font-weight:700}
.ph-head p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.tview{border:1px solid var(--line-2);background:transparent;color:var(--muted);border-radius:6px;font-size:11px;font-weight:600;height:24px;padding:0 8px}
.tview:hover{color:var(--ink)}
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
.hero-main{flex:1.4;min-width:220px;display:flex;flex-direction:column;justify-content:center}
.hero-main .lbl{font-size:12px;color:var(--ink-2);font-weight:600}
.hero-main .num{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero-main .lbl2{color:var(--muted);font-size:12px;margin-top:6px}
.tiles{flex:3;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.tile .tl{font-size:11.5px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px}
.tile .tl i{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--muted))}
.tile .tv{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.tile .td{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:-4px 0 10px;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px}
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.chart .val{fill:var(--ink-2);font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--hover)}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr;align-items:center;gap:10px;cursor:default}
.hb .hl{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.hb .hl i{width:8px;height:8px;border-radius:2px;flex:none}
.hb .ht{display:flex;align-items:center;gap:8px;min-width:0}
.hb .hbar{height:14px;border-radius:0 4px 4px 0;min-width:2px}
.hb .hv{font-size:11.5px;color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.hb:hover .hl{color:var(--ink)}
.segbar{display:flex;gap:2px;height:28px}
.segbar>div{border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.segbar>div.dk{color:#0b0b0b}
.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.rail .card{width:118px;flex:none}
.mini-table{width:100%;border-collapse:collapse;font-size:12px}
.mini-table th,.mini-table td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.mini-table th:first-child,.mini-table td:first-child{text-align:left}
.mini-table th{color:var(--muted);font-weight:600;font-size:11px}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--surface-3);border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);max-width:260px}
#tip .tt{font-weight:700;margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:7px;justify-content:space-between;color:var(--ink-2)}
#tip .tr span{display:flex;align-items:center;gap:6px}
#tip .tr i{width:8px;height:8px;border-radius:2px}
#tip .tr b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- painel de edição ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;padding-right:env(safe-area-inset-right,0px);padding-top:env(safe-area-inset-top,0px);z-index:61;width:min(600px,100vw);background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.dr-body{flex:1;overflow-y:auto}
.dr-hero{position:relative;padding:24px 26px 26px;display:flex;gap:22px;overflow:hidden;min-height:250px;border-bottom:1px solid var(--line)}
.dr-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(36px) saturate(1.2);opacity:.35;transform:scale(1.15)}
.dr-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 20%,var(--surface))}
.dr-hero>*{position:relative;z-index:1}
.dr-cover{width:150px;flex:none;aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5);background:var(--surface-2)}
.dr-cover img,.dr-cover .ph{width:100%;height:100%;object-fit:cover}
.dr-cover img{display:block}
.dr-cover .ph{font-size:30px}
.dr-info{flex:1;min-width:0;padding-top:14px;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.dr-info h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dr-info .by{color:var(--ink-2);font-size:13px}
.dr-info .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dr-info .imdbl{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12.5px;text-decoration:none}
.dr-close{position:absolute;top:12px;right:12px;z-index:2}
.form{padding:20px 26px;display:grid;grid-template-columns:1fr 1fr;gap:14px 14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.sect-t{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.fld label em,.sect-t em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--link);font-weight:600;margin-left:4px}
.inp{height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 12px;outline:0;color:var(--ink);width:100%}
.inp:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{height:76px;padding:10px 12px;resize:vertical}
select.inp{padding-right:8px}
.inp::placeholder{color:var(--muted)}
.checks{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 22px}
.sect{grid-column:1/-1;display:flex;flex-direction:column;gap:9px;padding-top:8px}
.sect-t{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.inline{display:flex;gap:8px}
.inline .inp{flex:1}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.res{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:6px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.res:hover{border-color:var(--accent-line)}
.res .rc{aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:var(--surface-3)}
.res .rc img{width:100%;height:100%;object-fit:cover;display:block}
.res b{font-size:11.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res small{font-size:10px;color:var(--muted)}
.note{font-size:11.5px;color:var(--muted)}
.note.err{color:var(--bad)}
.dr-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 26px;border-top:1px solid var(--line);background:var(--surface)}

/* ---------- modais / menu / toast ---------- */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55);animation:fade .15s}
.mbox{width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow)}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mhd h2{margin:0;font-size:16px}
.mbd{padding:6px 20px 20px}
.mbd h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
.mbd p{color:var(--ink-2);margin:6px 0}
.mbd ol{color:var(--ink-2);padding-left:20px;margin:8px 0}
.mbd ol li{margin:3px 0}
.radios{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.radio:has(input:checked){border-color:var(--accent-line);background:var(--accent-soft)}
.radio input{accent-color:var(--accent);margin-top:3px}
.radio b{display:block;font-size:13px}
.radio small{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.progress{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:12px 0}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .2s}
.log{max-height:220px;overflow:auto;font-size:11.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.log div{padding:2px 0;border-bottom:1px solid var(--line)}
.log .ok{color:var(--good)} .log .no{color:var(--muted)}
.menu{position:fixed;z-index:80;min-width:250px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:7px;background:transparent;color:var(--ink);text-align:left;font-size:12.5px}
.menu button:hover{background:var(--surface-3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:12.5px;animation:fade .2s;max-width:min(520px,calc(100vw - 32px))}
.toast.err{border-color:color-mix(in srgb,var(--bad) 60%,transparent)}

@media (max-width:1100px){
  .span-8,.span-6,.span-4{grid-column:span 12}
  .btn .lbl{display:none}
  .btn.hide-sm .lbl{display:none}
}
@media (max-width:820px){
  .top{flex-wrap:wrap;gap:8px 10px}
  .brand{order:1}
  .top .spacer{order:2}
  .acts{order:3;display:flex;gap:6px}
  .search{order:4;flex:1 1 100%;max-width:none}
  .seg{order:5;flex:1 1 auto}
  .seg button{flex:1;justify-content:center}
  .status-chip{order:6;flex:none}
  .status-chip .lbl{display:none}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
  .kpis{gap:16px;flex-wrap:wrap}
  .kpi b{font-size:15px}
  .kpi small{font-size:8.5px;letter-spacing:.04em}
  .hero-main .num{font-size:48px}
  .form{grid-template-columns:1fr;padding:18px 16px}
  .dr-hero{padding:20px 16px;gap:16px;min-height:0}
  .dr-cover{width:110px}
  .dr-foot{padding:12px 16px}
  .grid2{grid-template-columns:1fr}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(calc(108px*var(--zoom)),1fr));gap:14px 10px}
  .dash{padding:12px var(--gr) 12px var(--gl);gap:12px}
  .panelc{padding:14px}
}

/* ---------- capas em folhas (sprites) ---------- */
.cvs{background-repeat:no-repeat;background-size:1000% 1000%;background-color:var(--surface-2)}
td.c-cv .cvs{width:calc(34px*var(--zoom));height:calc(50px*var(--zoom));border-radius:4px;margin:auto}
.cv .cvs{width:100%;height:100%;transition:transform .25s}
.card:hover .cv .cvs{transform:scale(1.04)}
.dr-cover .cvs{width:100%;height:100%}
.dr-cover{position:relative;cursor:pointer}
.dr-cover.drop{outline:2px dashed var(--accent);outline-offset:3px}
.dr-cover .cv-hint{position:absolute;inset:auto 0 0 0;padding:6px;font-size:10.5px;font-weight:600;text-align:center;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transition:opacity .15s}
.dr-cover:hover .cv-hint,.dr-cover:focus-visible .cv-hint{opacity:1}
.linkrow{display:flex;flex-wrap:wrap;gap:8px}
.ro-note{padding:8px var(--gr) 8px var(--gl);font-size:12px;color:var(--ink-2);background:var(--surface-2);border-bottom:1px solid var(--line)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;background:var(--surface-3);padding:1px 5px;border-radius:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ====================== Dashboard v2 ====================== */
:root{
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;   /* categóricas validadas (escuro) */
  --sc-up:#199e70; --sc-dn:#d95926;
  --seq1:#1d3a60; --seq2:#265a9e; --seq3:#3987e5; --seq4:#9ec5f4; --seq0:#1a1a1e;
}
:root[data-theme="light"]{
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --sc-up:#1baf7a; --sc-dn:#eb6834;
  --seq1:#b7d3f6; --seq2:#86b6ef; --seq3:#3987e5; --seq4:#1c5cab; --seq0:#ececea;
}
[data-drill],[data-open],[data-go],[data-quick],[data-feat]{cursor:pointer}
.clk{cursor:pointer}
.span-12{grid-column:span 12}
.dash{align-items:stretch}
.panelc{display:flex;flex-direction:column}
.panelc>.chart,.panelc>.hbars,.panelc>.rail,.panelc>.tablewrap{flex:none}
.subh{margin:18px 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{font-size:11.5px;color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(220px,.95fr) minmax(0,1.5fr);gap:18px;align-items:stretch}
.hero-main{display:flex;flex-direction:column;justify-content:flex-start;min-width:0}
.hero-main .num{font-size:60px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:2px}
.delta{margin-top:8px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--ink-2)}
.hero-main .lbl2{margin-top:6px}
.spark-wrap{margin-top:auto;padding-top:14px}
.lbl3{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.spark{display:block;max-width:300px;overflow:visible}
.spark .tick{fill:var(--muted);font-size:9.5px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:stretch}
button.tile{font:inherit;color:inherit;text-align:left;cursor:pointer}
button.tile:hover{border-color:var(--line-2);background:var(--surface-3)}
.tile .tv{font-size:28px}

/* destaque */
.mini-seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);flex:none}
.mini-seg button{height:24px;padding:0 9px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap}
.mini-seg button.on{background:var(--surface-3);color:var(--ink)}
.feat{display:flex;gap:16px;align-items:flex-start;cursor:pointer;min-width:0}
.feat-cv{width:128px;flex:none;aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.38);background:var(--surface-2)}
.feat-cv img,.feat-cv .cvs,.feat-cv .ph{width:100%;height:100%;object-fit:cover;display:block}
.feat-cv .ph{font-size:26px}
.feat-info{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0;padding-top:2px}
.feat-info h4{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.feat-info h4.comp{color:var(--companhia)}
.feat-info .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.feat-meta{font-size:12px;color:var(--ink-2)}
.feat-date{font-size:11.5px;color:var(--muted)}

/* trilhos maiores */
.rail{gap:14px}
.rail .card{width:150px}

/* barras horizontais clicáveis, empilhadas */
.hb.clk:hover .hl{color:var(--ink)}
.hb.clk:hover .hbar,.hb.clk:hover .stack{filter:brightness(1.12)}
.stack{display:flex;gap:2px;height:14px;min-width:2px}
.stack>div{min-width:2px}
.stack>div:last-child{border-radius:0 4px 4px 0}
.segbar>div.clk:hover{filter:brightness(1.1)}
.chart .hit.clk:hover{fill:var(--hover)}
.chart .dot{cursor:pointer}
.chart .dot:hover{stroke:var(--ink);stroke-width:1.5}
.chart .cross{stroke:var(--axis);stroke-width:1}
.chart .tipzone{cursor:crosshair}

/* calendário de atividade */
.heat-scroll{overflow-x:auto;padding-bottom:6px}
.heat{display:flex;gap:8px;--hc:13px;width:max-content}
.heat-dow{display:grid;grid-template-rows:repeat(7,var(--hc));gap:3px;margin-top:17px;font-size:10px;color:var(--muted);line-height:var(--hc)}
.heat-dow span:nth-child(1){grid-row:1}.heat-dow span:nth-child(2){grid-row:3}.heat-dow span:nth-child(3){grid-row:5}
.heat-months{display:grid;grid-auto-flow:column;grid-auto-columns:var(--hc);gap:3px;height:14px;font-size:10px;color:var(--muted);margin-bottom:3px}
.heat-months span{white-space:nowrap;overflow:visible}
.heat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--hc));grid-auto-columns:var(--hc);gap:3px}
.hc{display:block;width:var(--hc);height:var(--hc);border-radius:3px;background:var(--seq0)}
.hc.l1{background:var(--seq1)}.hc.l2{background:var(--seq2)}.hc.l3{background:var(--seq3)}.hc.l4{background:var(--seq4)}
.hc.off{background:transparent}
.hc.fut{background:transparent;box-shadow:0 0 0 1px var(--line) inset}
.heat-grid .hc:not(.off):not(.fut):hover{outline:2px solid var(--ink-2);outline-offset:1px}
.heat-legend{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:10.5px;color:var(--muted);margin-top:8px}
.heat-legend .hc{width:12px;height:12px}

/* mosaico do ano */
.mosaic{display:flex;flex-direction:column;gap:10px}
.mo-row{display:flex;gap:12px;align-items:flex-start}
.mo-lab{width:52px;flex:none;font-size:12px;font-weight:700;text-transform:capitalize;padding-top:2px}
.mo-lab small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
.mo-tiles{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.mt{width:calc(62px*var(--zoom));height:calc(93px*var(--zoom));padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--surface-2);position:relative;flex:none}
.mt img,.mt .cvs,.mt .ph{width:100%;height:100%;object-fit:cover;display:block}
.mt .ph{font-size:calc(17px*var(--zoom))}
.mt:hover{outline:2px solid var(--ink);outline-offset:1px;z-index:1}

/* nota × IMDb */
.scatter-wrap{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:22px;align-items:start}
.pairs{display:flex;flex-direction:column;gap:6px;min-width:0}
.pairs .subh:first-child{margin-top:0}
.pair{display:flex;gap:10px;align-items:center;padding:5px;border-radius:8px}
.pair:hover{background:var(--hover)}
.pair-cv{width:34px;height:51px;flex:none;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.pair-cv img,.pair-cv .cvs,.pair-cv .ph{width:100%;height:100%;object-fit:cover;display:block}
.pair-cv .ph{font-size:11px}
.pair-t{min-width:0;flex:1}
.pair-t b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair-t small{color:var(--muted);font-size:11px}
.pair-d{font-size:12px;font-weight:700;white-space:nowrap}
.pair-d.up{color:var(--good)} .pair-d.down{color:var(--bad)}

/* parados */
.stalled{display:flex;flex-direction:column}
.st-row{display:flex;gap:12px;align-items:center;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.st-row:first-child{border-top:0}
.st-row:hover{background:var(--hover)}
.st-cv{width:32px;height:48px;flex:none;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.st-cv img,.st-cv .cvs,.st-cv .ph{width:100%;height:100%;object-fit:cover;display:block}
.st-cv .ph{font-size:11px}
.st-t{min-width:0;flex:1}
.st-t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-t small,.st-d small{color:var(--muted);font-size:11px}
.st-d{text-align:right;white-space:nowrap}
.st-d b{display:block;font-size:12.5px}
.st-a{display:flex;gap:6px;flex:none}

/* faixa de filtros vindos dos gráficos */
.drillbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:0 var(--gr) 8px var(--gl)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.toast-act{margin-left:10px;border:0;background:transparent;color:var(--link);font-weight:700;padding:0;text-decoration:underline}
#toast .toast{pointer-events:auto}

@media (max-width:1100px){
  .hero{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .scatter-wrap{grid-template-columns:1fr}
}
@media (max-width:620px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-main .num{font-size:52px}
  .feat-cv{width:104px}
  .rail .card{width:128px}
  .st-row{flex-wrap:wrap}
  .st-a{width:100%;justify-content:flex-end}
  .mo-row{flex-direction:column;gap:4px}
  .mo-lab{width:auto;display:flex;gap:6px;align-items:baseline}
}

/* letras dos placeholders sem capa ficam centralizadas */
.feat-cv .ph,.mt .ph,.pair-cv .ph,.st-cv .ph{display:grid;place-items:center}

/* nota × IMDb em telas largas: gráfico no meio de duas listas maiores */
.scatter-wrap.s3{grid-template-columns:var(--cw) minmax(0,1fr) minmax(0,1fr);gap:30px;align-items:start}
.scatter-wrap.s3 .pairs{gap:4px}
.scatter-wrap.s3 .pair{padding:3px 6px}
.scatter-wrap.s3 .pair-t b{font-size:13px}
@media (max-width:620px){ .pair-t b{white-space:normal} }

/* ====================== Movimento e interação ====================== */
:root{
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --ease-spring:cubic-bezier(.3,1.5,.5,1);
  --aur:.34;
}
:root[data-theme="light"]{
  --aur:.2;
}

/* ---------- entrada do painel ---------- */
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.985)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes pop{from{transform:scale(0);opacity:0}}
@keyframes draw{from{stroke-dasharray:1 2;stroke-dashoffset:1}to{stroke-dasharray:1 2;stroke-dashoffset:0}}
@keyframes sweep{from{left:-60%}to{left:135%}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(9%,11%) scale(1.2)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes tipIn{from{opacity:0;transform:translateY(5px) scale(.96)}}

.dash.enter .panelc{animation:rise .8s var(--ease-out) backwards;animation-delay:calc(min(var(--n,0),9)*70ms)}
#tip{animation:tipIn .14s var(--ease-out)}

/* ---------- blocos: borda e brilho que seguem o mouse ---------- */
.panelc{position:relative;transition:transform .5s var(--ease-out),box-shadow .5s var(--ease-out)}
.panelc::before{
  content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;z-index:3;opacity:0;transition:opacity .4s;
  background:radial-gradient(360px circle at var(--px,50%) var(--py,0px),color-mix(in srgb,var(--accent) 90%,transparent),transparent 62%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.panelc::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;opacity:0;transition:opacity .45s;
  background:radial-gradient(520px circle at var(--px,50%) var(--py,0px),color-mix(in srgb,var(--accent) 9%,transparent),transparent 62%);
}
.panelc:hover::before,.panelc:hover::after{opacity:1}
.panelc:hover{transform:translateY(-3px);box-shadow:0 26px 50px -28px rgba(0,0,0,.6)}
#d-hero>.hero,#d-feat>:not(.glow-wrap):not(.ptab){position:relative;z-index:1}

/* aura animada atrás do resumo e da capa em destaque */
.aurora-wrap,.glow-wrap{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.aurora-wrap i{position:absolute;width:46%;aspect-ratio:1;border-radius:50%;filter:blur(56px);opacity:var(--aur);animation:drift 17s ease-in-out infinite alternate}
.aurora-wrap i:nth-child(1){left:-8%;top:-34%;background:radial-gradient(circle,var(--accent),transparent 70%)}
.aurora-wrap i:nth-child(2){right:-10%;top:8%;background:radial-gradient(circle,var(--s1),transparent 70%);animation-duration:23s;animation-delay:-7s}
.aurora-wrap i:nth-child(3){left:34%;bottom:-48%;background:radial-gradient(circle,var(--s3),transparent 70%);opacity:calc(var(--aur)*.65);animation-duration:20s;animation-delay:-12s}
.feat-glow{position:absolute;right:-14%;top:-8%;width:64%;aspect-ratio:2/3;filter:blur(50px) saturate(1.7);opacity:calc(var(--aur)*1.15);transform:rotate(10deg);animation:drift 19s ease-in-out infinite alternate}
.feat-glow img,.feat-glow .cvs,.feat-glow .ph{width:100%;height:100%;display:block}

/* ---------- capas: inclinação 3D, brilho, paralaxe ---------- */
.card .cv,.feat-cv{
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px)) scale(var(--sc,1));
  transition:transform .65s var(--ease-out),box-shadow .5s var(--ease-out);will-change:transform;
}
.card:hover .cv{--ty:-8px;--sc:1.055;box-shadow:0 30px 46px -18px rgba(0,0,0,.7),0 0 0 1px var(--line-2) inset}
.feat-cv:hover{--sc:1.04;box-shadow:0 26px 50px -16px rgba(0,0,0,.65)}
.card .cv.tilting,.feat-cv.tilting{transition:transform .14s ease-out,box-shadow .45s}
.card:hover .cv img,.card:hover .cv .cvs,.feat-cv:hover img,.feat-cv:hover .cvs{
  transform:translate(calc(var(--nx,0)*9px),calc(var(--ny,0)*9px)) scale(1.12);
}
.cv img,.cv .cvs,.feat-cv img,.feat-cv .cvs{transition:transform .6s var(--ease-out)}
.cv.tilting img,.cv.tilting .cvs,.feat-cv.tilting img,.feat-cv.tilting .cvs{transition:transform .14s ease-out}
.cv::before,.feat-cv::before{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;mix-blend-mode:soft-light;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.55),transparent 58%);
}
.card:hover .cv::before,.feat-cv:hover::before{opacity:1}
.cv::after,.feat-cv::after{
  content:"";position:absolute;top:-25%;bottom:-25%;left:-60%;width:38%;z-index:2;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg);opacity:0;
}
.card:hover .cv::after,.feat-cv:hover::after{opacity:1;animation:sweep 1s var(--ease-out)}
.cv .spill{transition:transform .5s var(--ease-out);transform:translate(calc(var(--nx,0)*-6px),calc(var(--ny,0)*-6px))}
.cv-b{transition:transform .5s var(--ease-out),opacity .3s;transform:translateY(8px);opacity:.88}
.card:hover .cv-b{transform:translate(calc(var(--nx,0)*-5px),0);opacity:1}
.card h4{transition:color .25s}
.card:hover h4:not(.comp){color:var(--accent-2)}

/* trilhos: as outras capas recuam */
.rail{padding:14px 6px 12px;margin:-8px -6px 0}
.rail .card,.cgrid .card{transition:opacity .4s,filter .4s,transform .5s var(--ease-out)}
.rail:has(.card:hover) .card:not(:hover){opacity:.5;filter:saturate(.65);transform:scale(.965)}
.cgrid:has(.card:hover) .card:not(:hover){opacity:.72;filter:saturate(.8)}
.rail-group{margin-top:6px}
.rail-group+.rail-group{margin-top:10px}
.rail-gh{display:flex;align-items:center;gap:9px;margin:12px 0 0}
.rail-gh i{width:9px;height:9px;border-radius:3px;flex:none}
.rail-gh b{font-size:13px;letter-spacing:-.005em}
.rail-gh span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-gh .tview{margin-left:auto}
.rail-group .rail{margin-top:-6px}

/* ---------- indicadores e botões ---------- */
.tile{transition:transform .35s var(--ease-out),border-color .3s,background .3s,box-shadow .35s}
.tile:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--sc,var(--accent)) 60%,transparent);box-shadow:0 16px 28px -16px color-mix(in srgb,var(--sc,var(--accent)) 70%,transparent)}
.tile .tl i{transition:transform .35s var(--ease-spring)}
.tile:hover .tl i{transform:scale(1.8)}
.delta.up span{display:inline-block;animation:bob 1.8s ease-in-out infinite}
.delta.down span{display:inline-block;animation:bob 1.8s ease-in-out infinite reverse}
.chip{transition:transform .25s var(--ease-out),background .2s,border-color .2s,color .2s}
.chip:hover{transform:translateY(-1px)}
.btn{transition:transform .25s var(--ease-out),background .2s,box-shadow .3s,border-color .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.primary:hover{box-shadow:0 10px 24px -10px color-mix(in srgb,var(--accent) 80%,transparent)}
.seg button{transition:background .25s,color .25s,transform .25s var(--ease-out)}
.seg button:hover{transform:translateY(-1px)}
.tview{transition:background .2s,color .2s,transform .25s var(--ease-out),border-color .2s}
.tview:hover{transform:translateY(-1px);border-color:var(--accent-line)}

/* ---------- gráficos ---------- */
[data-k]{transition:opacity .25s,filter .25s}
.dim{opacity:.16!important}
.lit{filter:brightness(1.18)}
.legend span[data-hl]{cursor:default;transition:opacity .2s,transform .25s var(--ease-out)}
.legend span[data-hl]:hover{transform:translateY(-1px);color:var(--ink)}

.dash.anim .seg{transform-box:fill-box;transform-origin:50% 100%;animation:growy .85s var(--ease-out) backwards;animation-delay:calc(min(var(--n,0),9)*70ms + 240ms + var(--i,0)*36ms)}
.dash.anim .bar-g .val{animation:fadeIn .5s backwards;animation-delay:calc(min(var(--n,0),9)*70ms + 760ms + var(--i,0)*36ms)}
.bar-g{transition:opacity .25s}
.chart svg:has(.bar-g:hover) .bar-g:not(:hover){opacity:.38}
.bar-g:hover .seg{filter:brightness(1.2)}
.bar-g:hover .tick,.bar-g:hover .val{fill:var(--ink)}

.dash.anim .hbar,.dash.anim .stack{transform-origin:0 50%;animation:growx .95s var(--ease-out) backwards;animation-delay:calc(min(var(--n,0),9)*70ms + 240ms + var(--i,0)*65ms)}
.dash.anim .hv{animation:fadeIn .5s backwards;animation-delay:calc(min(var(--n,0),9)*70ms + 640ms + var(--i,0)*65ms)}
.hb{transition:opacity .25s,transform .35s var(--ease-out)}
.hbars:has(.hb:hover) .hb:not(:hover){opacity:.42}
.hb:hover{transform:translateX(5px)}
.hb:hover .hbar,.hb:hover .stack{filter:brightness(1.18)}
.hb .hbar,.hb .stack{transition:filter .25s}

.segbar>div{transition:transform .3s var(--ease-out),filter .25s;transform-origin:0 50%}
.segbar>div:hover{transform:scaleY(1.28);filter:brightness(1.12);position:relative;z-index:1}
.dash.anim .segbar>div{animation:growx 1s var(--ease-out) backwards;animation-delay:calc(min(var(--n,0),9)*70ms + 260ms)}

.spark g path{transform-box:fill-box;transform-origin:50% 100%;transition:transform .35s var(--ease-spring),opacity .2s}
.spark g:hover path{transform:scaleY(1.2);opacity:1!important}
.dash.anim .spark path{animation:growy .85s var(--ease-out) backwards;animation-delay:calc(300ms + var(--i,0)*48ms)}

.dash.anim .yline{animation:draw 1.6s cubic-bezier(.4,0,.2,1) backwards;animation-delay:calc(min(var(--n,0),9)*70ms + 320ms + var(--i,0)*190ms)}
.dash.anim .ydot{transform-box:fill-box;transform-origin:center;animation:pop .55s var(--ease-spring) backwards;animation-delay:calc(min(var(--n,0),9)*70ms + 1650ms + var(--i,0)*190ms)}
.chart .yline{transition:opacity .25s,stroke-width .25s}

.dash.anim .chart .dot{transform-box:fill-box;transform-origin:center;animation:pop .55s var(--ease-spring) backwards;animation-delay:calc(min(var(--n,0),9)*70ms + 300ms + min(var(--i,0)*3.5ms,800ms))}
.chart .dot{transition:transform .22s var(--ease-spring),stroke .2s;transform-box:fill-box;transform-origin:center}
.chart .dot:hover{transform:scale(2.1);stroke:var(--ink);stroke-width:1.5}

.dash.anim .heat-grid .hc{animation:pop .55s var(--ease-spring) backwards;animation-delay:calc(min(var(--n,0),9)*70ms + 200ms + var(--c,0)*17ms + var(--r,0)*24ms)}
.hc{position:relative;transition:transform .2s var(--ease-spring),box-shadow .25s}
.heat-grid .hc:not(.off):not(.fut):hover{transform:scale(1.9);z-index:4;border-radius:5px;outline:none;box-shadow:0 0 0 2px var(--surface),0 10px 20px -4px rgba(0,0,0,.6)}

/* ---------- mosaico com lupa ---------- */
.mt{transition:transform .17s var(--ease-out),box-shadow .25s;transform-origin:50% 55%}
.mt.mag{box-shadow:0 16px 30px -8px rgba(0,0,0,.7)}
.mt:hover{outline:2px solid color-mix(in srgb,var(--accent) 85%,transparent);outline-offset:1px}
.dash.enter .mt{animation:pop .55s var(--ease-spring) backwards;animation-delay:calc(min(var(--n,0),9)*70ms + 450ms + min(var(--k,0)*7ms,1100ms))}

/* ---------- listas ---------- */
.pair{transition:background .2s,transform .35s var(--ease-out)}
.pair:hover{transform:translateX(5px)}
.pair-cv{transition:transform .4s var(--ease-spring)}
.pair:hover .pair-cv{transform:scale(1.18) rotate(-4deg)}
.st-row{position:relative;overflow:hidden;transition:background .25s,transform .4s var(--ease-out)}
.st-row::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:3px;border-radius:3px;background:var(--accent);transform:scaleY(0);transition:transform .4s var(--ease-spring)}
.st-row:hover::before{transform:scaleY(1)}
.st-row:hover{transform:translateX(6px)}
.st-cv{transition:transform .45s var(--ease-spring),box-shadow .3s}
.st-row:hover .st-cv{transform:rotate(-5deg) scale(1.14);box-shadow:0 12px 22px -6px rgba(0,0,0,.65)}
@media (hover:hover){
  .st-a{opacity:0;transform:translateX(12px);transition:opacity .25s,transform .4s var(--ease-out)}
  .st-row:hover .st-a,.st-row:focus-within .st-a{opacity:1;transform:none}
}

/* ---------- reorganizar blocos ---------- */
.ptab{
  position:absolute;top:-14px;left:50%;z-index:7;display:flex;gap:2px;padding:3px;border-radius:999px;
  background:var(--surface-3);border:1px solid var(--line-2);box-shadow:0 10px 26px -8px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transform:translate(-50%,8px) scale(.9);transition:opacity .22s,transform .35s var(--ease-spring);
}
.panelc:hover .ptab,.panelc:focus-within .ptab,.dash.editing .ptab{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.ptab button{height:24px;min-width:26px;padding:0 8px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font-size:11px;font-weight:700;display:grid;place-items:center;transition:background .2s,color .2s,transform .25s var(--ease-spring)}
.ptab button:hover{background:var(--hover);color:var(--ink);transform:scale(1.08)}
.ptab svg{width:15px;height:15px}
.grip{cursor:grab;touch-action:none}
.dash-bar{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap;min-height:30px}
.dash-bar .btn svg{width:14px;height:14px}
.dash-bar.editing{justify-content:space-between;padding:10px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);animation:rise .45s var(--ease-out) backwards}
.db-txt{font-size:12.5px;color:var(--ink-2);flex:1 1 320px}
.db-act{display:flex;gap:8px}
.dash.editing .panelc{outline:1.5px dashed var(--accent-line);outline-offset:4px}
.panelc.dragging{
  transition:none!important;cursor:grabbing;outline:none!important;
  box-shadow:0 44px 90px -24px rgba(0,0,0,.7),0 0 0 2px var(--accent);will-change:transform;animation:none!important;
}
.panelc.dragging::before,.panelc.dragging::after{opacity:0}
.drop-ph{
  display:grid;place-items:center;border:2px dashed var(--accent-line)!important;background:color-mix(in srgb,var(--accent) 7%,transparent)!important;
  color:var(--accent-2);font-size:13px;font-weight:700;letter-spacing:.02em;animation:none!important;
}
.drop-ph::before,.drop-ph::after{display:none}
.drop-ph:hover{transform:none;box-shadow:none}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none!important}
@media (max-width:1100px){.ptab .psize{display:none}}
@media (hover:none){.panelc:hover{transform:none;box-shadow:none}}

/* ====================== Recursos novos ====================== */
/* período e visões */
.chip svg.i{width:13px;height:13px}
.chip.period.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.popform{min-width:290px;max-width:calc(100vw - 16px)}
.pf-presets{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.pf-custom{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 6px 6px}
.pf-custom label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.pf-custom .inp{height:34px}
.popform .btnrow{padding:2px 6px 6px;margin-top:0}
.vw-row{display:flex;align-items:center}
.vw-row button:first-child{flex:1}
.vw-row .vw-x{width:30px;flex:none;justify-content:center;color:var(--muted)}
.vw-new{display:flex;gap:6px;padding:4px 6px 6px}
.vw-new .inp{height:32px}

/* coluna Tempo */
td.c-tempo{width:116px;font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}

/* barra e mural das capas */
.cbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:14px var(--gr) 0 var(--gl)}
.mural .cgroup{padding:0 8px}
.mural .cgrid{grid-template-columns:repeat(auto-fill,minmax(calc(104px*var(--zoom)),1fr));gap:3px}
.mural .card h4,.mural .card .sub,.mural .card .meta{display:none}
.mural .cv{border-radius:3px;border-top-width:0}
.mural .cv .spill,.mural .cv-b{opacity:0;transition:opacity .25s}
.mural .card:hover .cv .spill,.mural .card:hover .cv-b{opacity:1}
.mural .mhead{padding-left:10px}

/* qualidade dos dados */
.q-sec{border:1px solid var(--line);border-radius:12px;margin:12px 0;background:var(--surface-2);overflow:hidden}
.q-sec summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;list-style:none;font-size:13px}
.q-sec summary::-webkit-details-marker{display:none}
.q-n{font-size:12px;font-weight:700;color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);padding:2px 9px;border-radius:99px}
.q-n.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.q-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;padding:11px 14px;border-top:1px solid var(--line)}
.q-t{min-width:0;flex:1 1 100%}
.q-t small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.q-open{background:none;border:0;padding:0;text-align:left;color:var(--ink);font-size:13px}
.q-open:hover{color:var(--accent-2);text-decoration:underline}
.q-f{display:flex;gap:8px}
.q-f label{font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.q-f .inp{height:32px;width:138px}
.q-a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;flex:1 1 auto}
.q-list{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 12px}
.q-chip{border:1px solid var(--line-2);background:var(--surface-3);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--ink-2)}
.q-chip:hover{border-color:var(--accent-line);color:var(--ink)}
.q-pg{padding:6px 14px 10px;border-top:1px solid var(--line)}
.q-pgh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.q-pgh small{color:var(--muted)}
.q-pv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;font-size:12.5px;color:var(--ink-2)}
.q-pv em{font-style:normal;font-size:11px;color:var(--muted)}
.q-sec .note,.q-sec .btnrow{padding:0 14px 12px}
.q-badge{font-style:normal;background:var(--accent);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;font-weight:700}

/* capas em lote */
.bc-drop{display:grid;place-items:center;gap:2px;padding:24px;border:2px dashed var(--line-2);border-radius:12px;cursor:pointer;margin:12px 0;text-align:center;color:var(--ink-2);transition:border-color .2s,background .2s}
.bc-drop.on,.bc-drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.bc-drop span{font-size:12px;color:var(--muted)}
.bc-rows{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:2px}
.bc-row{display:grid;grid-template-columns:44px minmax(0,.8fr) minmax(0,1.5fr) 84px;gap:10px;align-items:center}
.bc-th{width:44px;height:64px;object-fit:cover;border-radius:5px;background:var(--surface-2)}
.bc-fn{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bc-st{font-size:11px;color:var(--muted)}
.bc-row .inp{height:34px}


/* o que ver hoje */
.pick-ctl{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.pick-ctl label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:5px;min-width:120px;flex:1 1 130px}
.pick-ctl .inp{height:36px}
.pk-go{height:36px}
.pk-go svg{width:16px;height:16px}
#pk-n{margin:10px 0 12px}
.pk-out{min-height:0}
.pk-out:has(.pk-card){min-height:236px}
.shelf-more{display:flex;justify-content:center;padding:12px 0 6px}
.pk-card{display:flex;gap:20px;align-items:flex-start}
.pk-cv{width:150px;aspect-ratio:2/3;flex:none;border-radius:10px;overflow:hidden;background:var(--surface-2);transition:transform .2s,filter .2s}
.pk-cv img,.pk-cv .cvs,.pk-cv .ph{width:100%;height:100%;object-fit:cover}
.pk-cv img{display:block}
.pk-cv .ph{font-size:30px}
.pk-card.spin .pk-cv{filter:blur(1.4px) saturate(1.35);transform:scale(.97)}
.pk-card.landed .pk-cv{animation:land .65s var(--ease-spring);box-shadow:0 0 0 2px var(--accent),0 26px 52px -18px color-mix(in srgb,var(--accent) 75%,transparent)}
@keyframes land{from{transform:scale(.78) rotate(-5deg)}}
.pk-info{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.pk-info h4{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.pk-meta{font-size:12.5px;color:var(--ink-2)}
.pk-info .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* recordes */
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rcard{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);transition:transform .35s var(--ease-out),border-color .25s,box-shadow .35s;min-width:0}
.rcard.clk:hover{transform:translateY(-4px);border-color:var(--accent-line);box-shadow:0 16px 30px -18px color-mix(in srgb,var(--accent) 60%,transparent)}
.rc-k{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rc-v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:7px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-s{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* retrospectiva */
.poster-wrap{display:grid;place-items:center}
.poster-wrap canvas{max-width:100%;max-height:66vh;width:auto;height:auto;border-radius:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.dash-bar{gap:8px}
.dash-bar .btn span{white-space:nowrap}

/* celular: barra inferior e filtros recolhíveis */
#bnav,#btnFilters,.fbadge{display:none}
@media (max-width:1100px){
  .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pk-card{flex-direction:column}
}
@media (max-width:820px){
  #views{display:none}

const Store = {

  async init() {

      snap.docs.forEach(d => { this.bucketsSeen.add(d.id); Object.assign(next, (d.data() || {}).itens || {}); });

      if (loaded) render({ keep: true });

  },
  bucketOf(id) { return 'b' + String(parseInt(hashId(String(id)).slice(0, 6), 16) % 16).padStart(2, '0'); },
  async writeDoc(path, body, mergeKey) {

      if (e && e.code === 'invalid_argument' && !this.bucketsSeen.has(mergeKey)) { await ref.set(body); this.bucketsSeen.add(mergeKey); }

  },
  save(item) {

    ALL_FIELDS.forEach(f => { const v = item[f]; if (v !== undefined) clean[f] = v; });
    clean.excluido = !!item.excluido;
    clean.atualizadoEm = Date.now();
    edits[item.id] = clean;
    const b = this.bucketOf(item.id);
    this.pending++;
    updateStatus();
    this.chains[b] = (this.chains[b] || Promise.resolve())
      .then(() => this.writeDoc('edits/' + b, { itens: { [item.id]: clean } }, b))
      .catch(e => this.failed(e))
      .finally(() => { this.pending--; updateStatus(); });

  },
  saveMany(list) {
    if (!this.db) { toast('Esta visualização não consegue salvar. Abra o Backlog no claude.ai para editar.', true); return false; }
    if (this.canWrite === false) { toast('Você só pode ver este Backlog; quem o compartilhou precisa liberar edição.', true); return false; }
    const byBucket = {};
    list.forEach(item => {
      const clean = {};
      ALL_FIELDS.forEach(f => { const v = item[f]; if (v !== undefined) clean[f] = v; });
      clean.excluido = !!item.excluido; clean.atualizadoEm = Date.now();

    });

  },
  failed(e) {

  },

async function uploadCover(file) {
  if (!drawer) return;
  const d = drawer.draft, note = $('#capaNote', drawer.wrap);
  const assets = await use('assets');
  if (!assets) { note.className = 'note err'; note.textContent = 'Enviar capas só funciona para quem pode editar este Backlog, dentro do claude.ai.'; return; }
  note.className = 'note'; note.textContent = 'Enviando capa…';
  try {
    let blob = file;
    try {
      const bmp = await createImageBitmap(file);
      const s = Math.min(1, 600 / bmp.width);
      const cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      blob = await new Promise(r => cv.toBlob(b => r(b || file), 'image/webp', 0.86));
    } catch { /* envia o arquivo original */ }
    const r = await assets.upload(blob);
    if (!drawer || drawer.draft !== d) return;
    d.capaId = r.id;
    brokenAssets.delete(r.id);
    renderHero();
    fillCoverControls();
    note.textContent = 'Capa trocada. Clique em Pronto para salvar.';
  } catch (e) {
    note.className = 'note err';
    note.textContent = e.code === 'too_large' ? 'Imagem grande demais (máximo 20 MB).' : e.code === 'unsupported_type' ? 'Esse arquivo não é uma imagem aceita (use JPG, PNG ou WebP).' : e.code === 'rate_limited' ? 'Muitos envios seguidos; espere alguns segundos.' : 'Não consegui enviar a capa (' + (e.code || 'erro') + ').';
  }
}

  if (!(await ask('Restaurar dados originais', `Voltar para os ${fmtInt(SNAP.itens.length)} itens copiados da planilha em ${SNAP.geradoEm.split('-').reverse().join('/')}? Todas as alterações, inclusões e sincronizações feitas aqui serão descartadas.`, 'Restaurar', true))) return;
  try {
    await Store.clearEdits();
    await Store.db.doc('base/meta').delete();
    baseMeta = null; lastSyncAt = 0;
    base = SNAP.itens.map(expand);
    rebuild();
    render();
    toast('Dados originais restaurados.');
  } catch (e) { Store.failed(e); }
}

function updateStatus() {

  else if (Store.state === 'loading') { parts.push('Conectando…'); cls = 'info busy'; }
  else if (Store.state === 'slow') { parts.push('Sem conexão com os dados salvos'); cls = ''; }
  else if (Store.state === 'error') { parts.push('Erro ao salvar'); cls = 'err'; }
  else if (Store.pending) { parts.push('Salvando…'); cls = 'info busy'; }
  else parts.push('Salvo na nuvem');
  if (Drive.busy) { parts.push('lendo o Google Drive…'); cls = 'info busy'; }
  else if (Drive.error) parts.push('Drive: precisa de atenção');
  chip.className = 'status-chip ' + cls;
  $('#statusTxt').textContent = parts.join(' · ');
  chip.title = parts.join(' · ') + ' — clique para ver a ligação com o Google Drive';

const fmtDur = d => {
  if (d == null || isNaN(d)) return '';

  if (d < 60) return `${Math.round(d / 7)} semanas`;

  return `${(d / 365).toFixed(d < 1825 ? 1 : 0).replace('.', ',')} anos`;
};

// ---------- navegação a partir dos gráficos
function clearDrill() { drill.mfim = ''; drill.plat = ''; drill.nota = null; drill.serie = ''; drill.serieLabel = ''; }
function applyDrill(kind, val, toCovers) {

  if (kind === 'mes') { clearDrill(); drill.mfim = val; ui.year = 'all'; ui.range = null; ui.status = 'all'; ui.sort = { key: 'fim', dir: -1 }; }
  else if (kind === 'cat') { ui.cat = val; }
  else if (kind === 'status') { ui.status = val; }
  else if (kind === 'catstatus') { const [c, s] = val.split('|'); ui.cat = c; ui.status = s; }
  else if (kind === 'plat') { drill.plat = val; }
  else if (kind === 'nota') { drill.nota = parseFloat(val); }
  else if (kind === 'serie') { drill.serie = val; drill.serieLabel = (serieIdx.get(val) || [])[0] ? titleParts(serieIdx.get(val)[0]).title : val; ui.year = 'all'; }
  else return;
  saveUi();

}

const sectionHead = (title, sub, extra = '') => `<div class="ph-head"><div><h3>${esc(title)}</h3>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${extra}</div>`;

// ---------- destaque (capa grande)
let featMode = LS.get('backlog.feat', 'ultimo');
let dashPool = [];
function pickFeature(pool) {
  const hoje = todayIso();   // datas de término no futuro (erro de digitação) não entram no destaque
  const done = pool.filter(it => sKey(it) === 'concluido' && fimDe(it) && fimDe(it) <= hoje);
  if (!done.length) return null;
  if (featMode === 'melhor') {
    const withN = done.filter(it => nota(it) != null);
    if (!withN.length) return null;
    let month = todayIso().slice(0, 7);
    let inMonth = withN.filter(it => fimDe(it).startsWith(month));
    if (!inMonth.length) { month = withN.map(fimDe).sort().pop().slice(0, 7); inMonth = withN.filter(it => fimDe(it).startsWith(month)); }
    inMonth.sort((a, b) => nota(b) - nota(a) || (parseFloat(b.imdb) || 0) - (parseFloat(a.imdb) || 0) || fimDe(b).localeCompare(fimDe(a)));
    return { it: inMonth[0], label: `Melhor de ${MESES[+month.slice(5, 7) - 1]} de ${month.slice(0, 4)}` };
  }
  const sorted = done.slice().sort((a, b) => fimDe(b).localeCompare(fimDe(a)) || (b.row || 0) - (a.row || 0));
  const last = sorted.find(hasCover) || sorted[0];   // prefere um item com capa para o destaque ficar bonito
  return { it: last, label: 'Último que você terminou' };
}

// ---------- ano contra ano (linhas acumuladas)
const MONTH_START = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
const doyOf = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? (Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(+m[1], 0, 1)) / 86400000 : null; };
function yoyBuild(pool, y, yearSel) {
  const curY = new Date().getFullYear();
  const done = pool.filter(it => sKey(it) === 'concluido' && fimDe(it));
  let years = [...new Set(done.map(doneYear))].filter(x => x !== 'sem' && (!yearSel || x <= y)).sort().slice(-4);
  if (!years.length) return null;

// ---------- calendário de atividade
function heatBuild(pool, yearSel, y, range) {
  const today = todayNum();
  let from = yearSel ? Date.UTC(+y, 0, 1) / 86400000 : today - 364;
  let to = yearSel ? Date.UTC(+y, 11, 31) / 86400000 : today;
  if (range) { to = Math.min(today, dayNum(range.to)); from = Math.max(dayNum(range.from), to - 370); }
  const wd = n => (((n + 3) % 7) + 7) % 7;   // segunda = 0
  const start = from - wd(from);
  const act = new Map();
  const put = (iso, it, kind) => { if (!iso) return; const e = act.get(iso) || []; if (!e.some(x => x.it === it)) e.push({ it, kind }); act.set(iso, e); };
  pool.forEach(it => {
    put(it.ini, it, it.fim && it.fim === it.ini ? 'começou e terminou' : 'começou');
    if (it.fim && it.fim !== it.ini) put(it.fim, it, sKey(it) === 'dropado' ? 'largou' : 'terminou');
  });
  const weeks = Math.ceil((to - start + 1) / 7);
  let cells = '', months = '', activeDays = 0, run = 0, best = 0, total = 0, prevMon = -1;
  for (let w = 0; w < weeks; w++) {
    const n0 = start + w * 7, d1 = new Date(Math.max(n0, from) * 86400000);
    const mon = d1.getUTCMonth();
    months += `<span>${mon !== prevMon ? MES_CURTO[mon] : ''}</span>`;
    prevMon = mon;
    for (let k = 0; k < 7; k++) {
      const n = n0 + k;
      if (n < from || n > to) { cells += '<i class="hc off"></i>'; continue; }
      if (n > today) { cells += `<i class="hc fut" style="--c:${w};--r:${k}"></i>`; run = 0; continue; }
      const e = act.get(isoOfDay(n)) || [];
      const c = e.length;
      if (c) { activeDays++; total += c; run++; best = Math.max(best, run); } else run = 0;
      const lvl = c === 0 ? 0 : c === 1 ? 1 : c === 2 ? 2 : c <= 4 ? 3 : 4;
      const dt = new Date(n * 86400000);
      const tip = `<div class="tt">${DOW[dt.getUTCDay()]}, ${dt.getUTCDate()} de ${MESES[dt.getUTCMonth()].toLowerCase()} de ${dt.getUTCFullYear()}</div>` + (c ? e.slice(0, 6).map(x => `<div class="tr"><span>${esc(titleParts(x.it).title)}</span><b>${x.kind}</b></div>`).join('') + (c > 6 ? `<div class="tr"><span>+ ${c - 6}</span><b></b></div>` : '') : '<div class="tr"><span>Nada neste dia</span><b></b></div>');
      cells += `<i class="hc l${lvl}" style="--c:${w};--r:${k}" data-tip="${esc(tip)}"></i>`;
    }
  }
  return { cells, months, weeks, activeDays, best, total };
}

// ---------- tempo até terminar
function tempoRows(done) {
  const by = {};
  done.forEach(it => { const a = dayNum(it.ini), b = dayNum(it.fim); if (a == null || b == null || b < a) return; const c = catOf(it.tipo); (by[c.id] = by[c.id] || { c, d: [] }).d.push({ days: b - a, it }); });
  return Object.values(by).filter(g => g.d.length >= 3).map(g => {
    const s = g.d.map(x => x.days).sort((a, b) => a - b);
    const q = p => s[Math.min(s.length - 1, Math.floor(p * (s.length - 1)))];
    const longest = g.d.reduce((m, x) => (x.days > m.days ? x : m), g.d[0]);
    return { c: g.c, n: s.length, med: q(0.5), p75: q(0.75), longest };
  }).sort((a, b) => a.med - b.med);
}
