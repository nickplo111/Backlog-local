  const segs = [STATUS[2], STATUS[1], STATUS[0], STATUS[3]].map(s => ({ ...s, v: cnt[s.key] || 0 }));
  const tot = segs.reduce((a, s) => a + s.v, 0) || 1;
  const segHtml = `<div class="segbar" role="img" aria-label="${esc(segs.map(s => `${s.id}: ${s.v}`).join(', '))}">${segs.filter(s => s.v).map(s => { const p = s.v / tot * 100; return `<div class="clk" data-drill="status:${esc(s.id)}" style="flex:${s.v} 1 0;background:var(--s-${s.key})" data-tip="${esc(`<div class="tt">${s.id}</div><div class="tr"><span>Itens</span><b>${s.v}</b></div><div class="tr"><span>Parcela</span><b>${p.toFixed(1)}%</b></div>`)}">${p >= 11 ? Math.round(p) + '%' : ''}</div>`; }).join('')}</div><div class="legend" style="margin:12px 0 0">${segs.map(s => `<span><i style="background:var(--s-${s.key})"></i>${s.id} · ${fmtInt(s.v)}</span>`).join('')}</div>`;
  const byT = {};
  statusBase.forEach(it => { const c = catOf(it.tipo); const o = (byT[c.id] = byT[c.id] || { c, conc: 0, drop: 0, all: 0, st: {} }); o.all++; if (sKey(it) === 'concluido') o.conc++; if (sKey(it) === 'dropado') o.drop++; const k = statusOf(it.status)?.id || 'Sem status'; o.st[k] = (o.st[k] || 0) + 1; });
  const rates = Object.values(byT).filter(o => o.conc + o.drop >= 3).map(o => ({ o, pct: o.conc / (o.conc + o.drop) * 100 })).sort((a, b) => b.pct - a.pct)
    .map(({ o, pct }) => ({ label: o.c.id, value: pct, text: Math.round(pct) + '%', color: catColor(o.c), drill: 'cat:' + o.c.id, tip: `<div class="tt">${esc(o.c.id)}</div><div class="tr"><span>Concluídos</span><b>${o.conc}</b></div><div class="tr"><span>Dropados</span><b>${o.drop}</b></div>` }));
  put('d-status', sectionHead('Status', `${fmtInt(statusBase.length)} itens na seleção`) + segHtml
    + (rates.length ? `<h4 class="subh">Quanto você termina do que decide</h4><p class="note" style="margin:0 0 10px">Concluídos ÷ (concluídos + dropados)</p>${hbarsHtml(rates, { max: 100, reserve: 44 })}` : ''));

  // 5. ano contra ano
  const yoy = yoyBuild(pool, y, yearSel);
  if (yoy) {
    const mEnd = d => MONTH_START[d] ?? 0;
    const tbl = tableHtml(['Mês', ...yoy.series.map(s => s.year)], MES_CURTO.map((m, i) => { const endDay = (MONTH_START[i + 1] ?? 366) - 1; return [m, ...yoy.series.map(s => (endDay <= s.end ? s.cum[endDay] : '–'))]; }));
    put('d-yoy', sectionHead('Ano contra ano', 'Concluídos acumulados ao longo do ano', '<button class="tview" data-tv>Tabela</button>') + legendHtml(yoy.series.map(s => ({ name: s.year, color: s.color }))).replace('class="legend"', 'class="legend" style="margin-top:0"') + `<div class="chart" data-chart>${yoyChart(W('d-yoy'), yoy, 'yoy')}</div><div data-table hidden>${tbl}</div>`);
  } else put('d-yoy', sectionHead('Ano contra ano', 'Sem concluídos para comparar.'));

  // 6. notas (histograma, clicável)
  const bins = []; for (let b = 0.5; b <= 10; b += 0.5) bins.push(b);
  const hv = bins.map(() => 0);
  ns.forEach(n => { const i = bins.indexOf(Math.round(Math.min(10, Math.max(0.5, n)) * 2) / 2); if (i >= 0) hv[i]++; });
  const first = Math.max(0, hv.findIndex(x => x > 0) - 1);
  const bl = bins.slice(first).map(String);
  const hs = [{ name: 'Itens', color: 'var(--accent)', values: hv.slice(first) }];
  put('d-notas', sectionHead('Suas notas (N)', ns.length ? `${fmtInt(ns.length)} itens avaliados · média ${avg.toFixed(1)} · clique numa barra para ver` : 'Nenhum item com nota N nesta seleção', ns.length ? '<button class="tview" data-tv>Tabela</button>' : '')
    + (ns.length ? `<div class="chart" data-chart>${columnsSvg(W('d-notas'), bl.map(l => (l.endsWith('.5') ? '' : l)), hs, { tipTitle: (_, i) => `Nota ${bl[i]}`, totals: false, labelEvery: 1, aria: 'Distribuição das notas', drillOf: (i) => `nota:${bl[i]}` })}</div><div data-table hidden>${tableHtml(['Nota', 'Itens'], bl.map((l, i) => [l, hs[0].values[i]]))}</div>` : ''));

  // 7. por tipo e status (empilhado)
  const trows = Object.values(byT).sort((a, b) => b.all - a.all).map(o => ({ label: o.c.id, color: catColor(o.c), total: o.all, segs: STATUS.map(s => ({ ...s, v: o.st[s.id] || 0 })).sort((a, b) => [2, 1, 0, 3].indexOf(STATUS.indexOf(a)) - [2, 1, 0, 3].indexOf(STATUS.indexOf(b))) }));
  put('d-types', sectionHead('Por tipo e status', 'Clique no tipo ou num pedaço da barra', '<button class="tview" data-tv>Tabela</button>') + legendHtml([STATUS[2], STATUS[1], STATUS[0], STATUS[3]].map(s => ({ name: s.id, color: `var(--s-${s.key})` }))).replace('class="legend"', 'class="legend" style="margin-top:0"')
    + `<div class="chart" data-chart>${trows.length ? stackedHtml(trows) : '<p class="note">Sem itens.</p>'}</div><div data-table hidden>${tableHtml(['Tipo', 'Concluído', 'Em andamento', 'Na fila', 'Dropado', 'Total'], trows.map(r => [r.label, ...[2, 1, 0, 3].map(i => (byT[r.label] ? byT[r.label].st[STATUS[i].id] || 0 : 0)), r.total]))}</div>`);

  // 8. tempo até terminar
  const tr = tempoRows(done);
  const maxLog = Math.max(0.01, ...tr.map(r => Math.log1p(r.med)));
  const trowsH = tr.map(r => ({ label: r.c.id, value: Math.log1p(r.med) + 0.04, text: fmtDias(r.med), color: catColor(r.c), drill: 'cat:' + r.c.id, tip: `<div class="tt">${esc(r.c.id)} · ${r.n} itens</div><div class="tr"><span>Metade termina em até</span><b>${esc(fmtDias(r.med))}</b></div><div class="tr"><span>75% terminam em até</span><b>${esc(fmtDias(r.p75))}</b></div><div class="tr"><span>Mais demorado</span><b>${esc(fmtDias(r.longest.days))}</b></div><div class="tr"><span>${esc(titleParts(r.longest.it).title)}</span><b></b></div>` }));
  put('d-tempo', sectionHead('Tempo até terminar', 'Mediana entre “comecei” e “terminei”, por tipo', tr.length ? '<button class="tview" data-tv>Tabela</button>' : '')
    + (tr.length ? `<div class="chart" data-chart>${hbarsHtml(trowsH, { max: maxLog + 0.04, reserve: 96 })}</div><div data-table hidden>${tableHtml(['Tipo', 'Itens', 'Mediana', '75% até', 'Mais demorado'], tr.map(r => [r.c.id, r.n, fmtDias(r.med), fmtDias(r.p75), `${fmtDias(r.longest.days)} (${titleParts(r.longest.it).title})`]))}</div>` : '<p class="note">Poucos itens com data de início e fim nesta seleção.</p>'));

  // 9. calendário de atividade
  const heat = heatBuild(pool, yearSel, y, f.range);
  put('d-heat', sectionHead('Atividade', `${rangeSel ? `${isoToBr(f.range.from)} a ${isoToBr(f.range.to)}` : yearSel ? `Ano de ${y}` : 'Últimos 12 meses'} · ${fmtInt(heat.activeDays)} dias com atividade · maior sequência de ${heat.best} ${heat.best === 1 ? 'dia' : 'dias'} · itens que você começou ou terminou`)
    + `<div class="heat-scroll"><div class="heat" style="--hc:${Math.max(10, Math.min(24, Math.floor((W('d-heat') - 50) / heat.weeks) - 3))}px"><div class="heat-dow"><span>seg</span><span>qua</span><span>sex</span></div><div><div class="heat-months" style="--hw:${heat.weeks}">${heat.months}</div><div class="heat-grid" role="img" aria-label="Calendário de atividade">${heat.cells}</div></div></div></div>`
    + `<div class="heat-legend"><span>menos</span><i class="hc l0"></i><i class="hc l1"></i><i class="hc l2"></i><i class="hc l3"></i><i class="hc l4"></i><span>mais</span></div>`);

  // 10. seu ano (ou período) em capas
  const mYear = yearSel ? y : [...new Set(pool.filter(it => sKey(it) === 'concluido' && fimDe(it)).map(doneYear))].filter(x => x !== 'sem').sort().pop();
  const inR = it => fimDe(it) >= f.range.from && fimDe(it) <= f.range.to;
  const mItems = (rangeSel ? pool.filter(it => sKey(it) === 'concluido' && fimDe(it) && inR(it)) : mYear ? pool.filter(it => sKey(it) === 'concluido' && doneYear(it) === mYear) : []).sort((a, b) => fimDe(a).localeCompare(fimDe(b)) || (a.row || 0) - (b.row || 0));
  if (mItems.length) {
    const byM = {};
    let mk = 0;
    mItems.forEach(it => { const k = fimDe(it).slice(0, 7) || 'sem'; (byM[k] = byM[k] || []).push(it); });
    const ks = Object.keys(byM).sort(), multi = new Set(ks.map(k => k.slice(0, 4))).size > 1;
    put('d-mosaic', sectionHead(rangeSel ? 'Seu período em capas' : `Seu ano em capas · ${mYear}`, `${fmtInt(mItems.length)} concluídos, mês a mês. Clique numa capa para abrir.`)
      + `<div class="mosaic">${ks.map(k => `<div class="mo-row"><div class="mo-lab">${/^\d{4}-\d{2}$/.test(k) ? MES_CURTO[+k.slice(5, 7) - 1] + (multi ? '/' + k.slice(2, 4) : '') : '—'}<small>${byM[k].length}</small></div><div class="mo-tiles">${byM[k].map(it => { const av = parseAval(it.aval); return `<button type="button" class="mt" style="--k:${mk++}" data-open="${esc(it.id)}" aria-label="${esc(titleParts(it).title)}" data-tip="${esc(`<div class="tt">${esc(titleParts(it).title)}</div><div class="tr"><span>${esc(it.tipo || '')}</span><b></b></div>${av.tags.map(t => `<div class="tr"><span>${t.k}</span><b>${t.v}</b></div>`).join('')}${it.imdb ? `<div class="tr"><span>IMDb</span><b>${esc(it.imdb)}</b></div>` : ''}`)}">${coverHtml(it)}</button>`; }).join('')}</div></div>`).join('')}</div>`);
  } else put('d-mosaic', '');

  // 11. nota × IMDb
  const pts = list.map(it => ({ it, x: parseFloat(it.imdb), y: nota(it) })).filter(p => !isNaN(p.x) && p.x > 0 && p.y != null).map(p => ({ ...p, d: p.y - p.x }));
  if (pts.length >= 5) {
    // quanto espaço o bloco tem decide o desenho: em telas largas o gráfico fica entre duas listas maiores (10 ou 6 itens cada)
    const C = Math.max(300, $('#d-scatter').clientWidth - 36), stacked = innerWidth <= 1100;
    const tier = stacked ? 's' : C >= 1450 ? 'x' : C >= 1150 ? 'm' : 'w';
    const n = tier === 'x' ? 10 : tier === 'm' ? 6 : stacked ? 5 : 3;
    const up = pts.filter(p => p.d > 0).sort((a, b) => b.d - a.d).slice(0, n), dn = pts.filter(p => p.d < 0).sort((a, b) => a.d - b.d).slice(0, n);
    const three = tier === 'x' || tier === 'm';
    const cw = three ? Math.round(tier === 'x' ? Math.min(960, Math.max(520, C * 0.46)) : C * 0.42) : tier === 'w' ? Math.round(Math.min(C, 1100) * 0.64) : Math.min(C, 1100);
    const svg = scatterSvg(cw, pts, tier === 'x' ? 620 : tier === 'm' ? 400 : 320);
    const upH = '<h4 class="subh">Você amou mais que o IMDb</h4>', dnH = '<h4 class="subh">Decepções</h4>';
    put('d-scatter', sectionHead('Sua nota × nota do IMDb', `${fmtInt(pts.length)} itens com as duas notas · acima da linha, você gostou mais que o IMDb`)
      + `<div class="legend" style="margin-top:0"><span><i style="background:var(--sc-up)"></i>Você deu 1,5 ou mais acima</span><span><i style="background:var(--sc-dn)"></i>Você deu 1,5 ou mais abaixo</span><span><i style="background:var(--muted)"></i>Perto do IMDb</span></div>`
      + (three
        ? `<div class="scatter-wrap s3" style="--cw:${cw}px"><div class="chart">${svg}</div><div class="pairs">${upH}${diffList(up, 1)}</div><div class="pairs">${dnH}${diffList(dn, -1)}</div></div>`
        : `<div class="scatter-wrap"><div class="chart">${svg}</div><div class="pairs">${upH}${diffList(up, 1)}${dnH}${diffList(dn, -1)}</div></div>`));
  } else put('d-scatter', '');

  // 12. plataformas, autores, séries
  const pc = {};
  list.forEach(it => { const p = platCanon(it.plataforma); if (p) pc[p] = (pc[p] || 0) + 1; });
  const prow = Object.entries(pc).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, n]) => ({ label: k, value: n, color: 'var(--t-video)', drill: 'plat:' + k }));
  put('d-plat', sectionHead('Plataformas mais usadas', 'Nomes parecidos somados (steam, steam - deck…) · clique para filtrar', prow.length ? '<button class="tview" data-tv>Tabela</button>' : '')
    + (prow.length ? `<div class="chart" data-chart>${hbarsHtml(prow)}</div><div data-table hidden>${tableHtml(['Plataforma', 'Itens'], prow.map(r => [r.label, r.value]))}</div>` : '<p class="note">Sem plataformas informadas.</p>'));
  const ac = {};
  list.forEach(it => { String(it.autor || '').split(/\s+\+\s+/).map(s => s.trim()).filter(s => s && !isNoInfo(s)).forEach(a => { ac[a] = (ac[a] || 0) + 1; }); });
  const arow = Object.entries(ac).filter(([, n]) => n > 1).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, n]) => ({ label: k, value: n, color: 'var(--t-filme)' }));
  put('d-autor', sectionHead('Diretores, autores e estúdios', 'Quem mais aparece na seleção (2 ou mais itens)', arow.length ? '<button class="tview" data-tv>Tabela</button>' : '')
    + (arow.length ? `<div class="chart" data-chart>${hbarsHtml(arow)}</div><div data-table hidden>${tableHtml(['Nome', 'Itens'], arow.map(r => [r.label, r.value]))}</div>` : '<p class="note">Ninguém aparece mais de uma vez nesta seleção.</p>'));
  const poolIds = new Set(pool.map(it => it.id)), listIds = new Set(list.map(it => it.id));
  const allSeries = [...serieIdx.entries()].map(([k, arr]) => ({ k, arr: arr.filter(it => poolIds.has(it.id)) })).filter(g => g.arr.length >= 2);
  let serieScope = allSeries.filter(g => !yearSel || g.arr.some(it => listIds.has(it.id)));
  const serieAll = yearSel && serieScope.length < 5;   // poucas no ano: mostra de todos os anos
  if (serieAll) serieScope = allSeries;
  const srows = serieScope
    .sort((a, b) => b.arr.length - a.arr.length).slice(0, 10).map(g => { const c = catOf(g.arr[0].tipo), dn = g.arr.filter(x => sKey(x) === 'concluido').length; return { label: titleParts(g.arr[0]).title, value: g.arr.length, text: `${g.arr.length} temp. · ${dn} concl.`, color: catColor(c), drill: 'serie:' + g.k, tip: `<div class="tt">${esc(titleParts(g.arr[0]).title)}</div>${g.arr.map(x => `<div class="tr"><span>${esc(seasonLabel(x))}</span><b>${esc(statusOf(x.status)?.id || '')}</b></div>`).join('')}` }; });
  put('d-serie', sectionHead('Séries e animes por título', `Temporadas agrupadas${yearSel && !serieAll ? ` · séries com atividade em ${y}` : yearSel ? ' · de todos os anos (poucas em ' + y + ')' : ''} · clique para ver todas`, srows.length ? '<button class="tview" data-tv>Tabela</button>' : '')
    + (srows.length ? `<div class="chart" data-chart>${hbarsHtml(srows, { reserve: 128 })}</div><div data-table hidden>${tableHtml(['Título', 'Temporadas', 'Concluídas'], srows.map(r => [r.label, r.value, r.text.split('· ')[1]]))}</div>` : '<p class="note">Nenhuma série com mais de uma temporada nesta seleção.</p>'));

  // 13. parados há muito tempo
  const nowN = todayNum();
  const stalled = pool.filter(it => sKey(it) === 'andamento').sort((a, b) => (a.ini || '9999').localeCompare(b.ini || '9999') || (a.row || 0) - (b.row || 0));
  const o1 = stalled.filter(it => it.ini && nowN - dayNum(it.ini) > 365).length, o3 = stalled.filter(it => it.ini && nowN - dayNum(it.ini) > 1095).length;
  put('d-stalled', sectionHead('Parados há muito tempo', `${fmtInt(stalled.length)} em andamento · ${fmtInt(o1)} há mais de 1 ano · ${fmtInt(o3)} há mais de 3 anos`)
    + (stalled.length ? `<div class="stalled">${stalled.slice(0, 6).map(it => { const tp = titleParts(it), days = it.ini ? nowN - dayNum(it.ini) : null; return `<div class="st-row" data-open="${esc(it.id)}" role="button" tabindex="0"><div class="st-cv">${coverHtml(it)}</div><div class="st-t"><b>${esc(tp.title)}</b><small>${esc([it.tipo, it.plataforma && !isNoInfo(it.plataforma) ? it.plataforma : ''].filter(Boolean).join(' · '))}</small></div><div class="st-d"><b>${days != null ? fmtAgo(days) : 'sem data'}</b><small>${it.ini ? 'desde ' + monYear(it.ini) : ''}</small></div>${canW ? `<div class="st-a"><button type="button" class="btn sm" data-quick="${esc(it.id)}|Concluído">Terminei</button><button type="button" class="btn sm ghost" data-quick="${esc(it.id)}|Dropado">Larguei</button></div>` : ''}</div>`; }).join('')}</div>` : '<p class="note">Nada em andamento nesta seleção.</p>'));

  $$('.panelc', v).forEach(s => { if (!s.innerHTML.trim()) s.remove(); });
  $$('.panelc', v).forEach(addTab);
  initDashLayout($('.dash', v));
  if (opts.enter) countUp(v);
}

// ============================================================ EFEITOS, LAYOUT E ARRASTAR
const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let dragState = null;
let layoutEdit = false;

// ---------- ponteiro: brilho nos blocos, inclinação 3D nas capas, lupa no mosaico
(function pointerFx() {
  const view = $('#view');
  let raf = 0, last = null, tiltEl = null, mag = null;
  const resetTilt = el => { if (!el) return; ['--rx', '--ry', '--nx', '--ny', '--mx', '--my'].forEach(p => el.style.removeProperty(p)); el.classList.remove('tilting'); };
  const resetMag = () => { if (!mag) return; mag.list.forEach(t => { t.el.style.transform = ''; t.el.style.zIndex = ''; t.el.classList.remove('mag'); }); mag = null; };
  function frame() {
    raf = 0;
    const e = last;
    if (!e || dragState) return;
    const t = e.target;
    if (!t || !t.closest) return;
    const panel = t.closest('.panelc');
    if (panel) { const r = panel.getBoundingClientRect(); panel.style.setProperty('--px', (e.clientX - r.left) + 'px'); panel.style.setProperty('--py', (e.clientY - r.top) + 'px'); }
    if (reduceMotion()) return;
    const tilt = t.closest('.cv, .feat-cv');
    if (tilt !== tiltEl) { resetTilt(tiltEl); tiltEl = tilt; }
    if (tilt) {
      const r = tilt.getBoundingClientRect();
      const px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), py = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
      const nx = px * 2 - 1, ny = py * 2 - 1;
      tilt.style.setProperty('--rx', (-ny * 9).toFixed(2) + 'deg');
      tilt.style.setProperty('--ry', (nx * 11).toFixed(2) + 'deg');
      tilt.style.setProperty('--nx', nx.toFixed(3));
      tilt.style.setProperty('--ny', ny.toFixed(3));
      tilt.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
      tilt.style.setProperty('--my', (py * 100).toFixed(1) + '%');
      tilt.classList.add('tilting');
    }
    // lupa estilo "dock": as capas perto do ponteiro crescem
    const mo = t.closest('.mosaic');
    if (!mo) { resetMag(); return; }
    if (!mag || mag.root !== mo) {
      resetMag();
      mag = { root: mo, list: $$('.mt', mo).map(el => { const r = el.getBoundingClientRect(); return { el, cx: r.left + r.width / 2 + scrollX, cy: r.top + r.height / 2 + scrollY, s: 1 }; }) };
    }
    const X = e.clientX + scrollX, Y = e.clientY + scrollY;
    mag.list.forEach(m => {
      const d2 = (m.cx - X) ** 2 + (m.cy - Y) ** 2;
      const s = d2 > 160 * 160 ? 1 : 1 + 1.15 * Math.exp(-d2 / (2 * 56 * 56));
      if (s > 1.03) { m.el.style.transform = `scale(${s.toFixed(3)})`; m.el.style.zIndex = Math.round(s * 100); m.el.classList.add('mag'); m.s = s; }
      else if (m.s > 1) { m.el.style.transform = ''; m.el.style.zIndex = ''; m.el.classList.remove('mag'); m.s = 1; }
    });
  }
  view.addEventListener('pointermove', e => { if (e.pointerType === 'touch') return; last = e; if (!raf) raf = requestAnimationFrame(frame); });
  view.addEventListener('pointerleave', () => { last = null; resetTilt(tiltEl); tiltEl = null; resetMag(); });
  window.addEventListener('resize', resetMag);
})();

// ---------- realce de uma série ao passar o mouse na legenda
(function legendHighlight() {
  const view = $('#view');
  const setHl = (panel, key) => { $$('[data-k]', panel).forEach(el => { const on = key == null ? null : el.dataset.k === key; el.classList.toggle('dim', on === false); el.classList.toggle('lit', on === true); }); };
  view.addEventListener('pointerover', e => { const lg = e.target.closest && e.target.closest('[data-hl]'); const panel = lg && lg.closest('.panelc'); if (panel) setHl(panel, lg.dataset.hl); });
  view.addEventListener('pointerout', e => { const lg = e.target.closest && e.target.closest('[data-hl]'); if (!lg) return; if (e.relatedTarget && lg.contains(e.relatedTarget)) return; const panel = lg.closest('.panelc'); if (panel) setHl(panel, null); });
})();

// ---------- contadores que sobem até o valor
function countUp(root) {
  if (reduceMotion()) return;
  $$('[data-count]', root).forEach(el => {
    const to = parseFloat(el.dataset.count), dec = +el.dataset.dec || 0;
    if (!isFinite(to)) return;
    const dur = 1150, delay = +el.dataset.delay || 0;
    const ease = p => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
    const fmt = v => (dec ? v.toFixed(dec) : fmtInt(Math.round(v)));
    el.textContent = fmt(0);
    setTimeout(() => {
      const t0 = performance.now();
      const step = now => { const p = Math.max(0, Math.min(1, (now - t0) / dur)); el.textContent = fmt(to * ease(p)); if (p < 1 && el.isConnected) requestAnimationFrame(step); else el.textContent = fmt(to); };
      requestAnimationFrame(step);

const DASH_PANELS = [

    ids.forEach((id, i) => {

  isDefault() { const d = this.get(); return d.order.every((id, i) => id === DASH_PANELS[i][0]) && !Object.keys(d.span).length; },
  spanOf(id) { return this.get().span[id] || (DASH_PANELS.find(p => p[0] === id) || [0, 12])[1]; },
  goal(y) { return this.get().goals[String(y)] || 0; },
  setGoal(y, n) { const d = this.get(); if (n > 0) d.goals[String(y)] = Math.round(n); else delete d.goals[String(y)]; this.save(); },
  addView(name, f) { const d = this.get(); d.views = [...d.views.filter(v => v.name !== name), { id: hashId(name + Date.now()), name, f }].slice(-24); this.save(); },
  delView(id) { const d = this.get(); d.views = d.views.filter(v => v.id !== id); this.save(); },

  },
  reset() { const d = this.get(); this.data = this.clean({ goals: d.goals, views: d.views }); LS.set('backlog.layout', this.data); this.push(); },
  async init() {
    try {
      const uid = Store.user && (await Store.user.id());

// ---------- Drive: lê o arquivo inteiro (todas as abas) e acha a aba "Backlog"
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const DRIVE_FATAL = new Set(['server_not_connected', 'needs_reauth', 'selection_required', 'not_in_manifest', 'approval_required', 'blocked_by_policy', 'server_unavailable']);
let xlsxPromise = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPromise) {
    xlsxPromise = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = XLSX_URL;
      s.onload = () => (window.XLSX ? res(window.XLSX) : rej(new Error('leitor de planilhas indisponível')));
      s.onerror = () => { xlsxPromise = null; rej(new Error('não consegui carregar o leitor de planilhas')); };
      document.head.append(s);
    });
  }
  return xlsxPromise;
}
function b64FromResult(res) {
  const cands = [];
  const p = res && res.payload;
  if (typeof p === 'string') cands.push(p);
  else if (p && typeof p === 'object') Object.values(p).forEach(v => { if (typeof v === 'string' && v.length > 200) cands.push(v); });
  (res && res.content || []).forEach(b => { if (b && b.resource && b.resource.blob) cands.push(b.resource.blob); if (b && typeof b.data === 'string') cands.push(b.data); });
  for (const c of cands) {
    const t = c.replace(/^data:[^,]*,/, '').replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/');
    if (/^UEsD/.test(t)) return t;   // xlsx é um zip ("PK")
  }

}
function xlsxCellText(XL, cell, f) {
  if (!cell || cell.v == null || cell.v === '') return f === 'companhia' || f === 'destaque' ? false : '';
  if (f === 'companhia' || f === 'destaque') return /^(sim|s|x|true|1|yes)$/i.test(String(cell.v));
  if (f === 'imdb') {   // "6.4" que o Sheets virou data chega como número de série (ex.: 46271) ou como data
    if (cell.v instanceof Date) return fixImdb(`${cell.v.getUTCFullYear()}-${String(cell.v.getUTCMonth() + 1).padStart(2, '0')}-${String(cell.v.getUTCDate()).padStart(2, '0')}`);
    return fixImdb(cell.t === 'n' ? cell.v : cell.w != null ? cell.w : cell.v);
  }
  if (cell.t === 'n' && cell.z && XL.SSF.is_date(cell.z)) {
    const d = XL.SSF.parse_date_code(cell.v);
    return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`;
  }

  return s;
}
function rowsFromXlsx(XL, b64) {
  const wb = XL.read(b64, { type: 'base64' });
  const headerRow = ws => {
    const rng = XL.utils.decode_range(ws['!ref'] || 'A1');
    for (let r = rng.s.r; r <= Math.min(rng.e.r, rng.s.r + 5); r++) for (let c = rng.s.c; c <= rng.e.c; c++) { const cell = ws[XL.utils.encode_cell({ r, c })]; if (cell && fieldFor(String(cell.v)) === 'nome') return r; }
    return -1;
  };
  const names = wb.SheetNames;
  const ordered = [...names.filter(n => /backlog/i.test(n)), ...names.filter(n => !/backlog/i.test(n))];
  let best = null;
  for (const n of ordered) { const ws = wb.Sheets[n]; if (!ws || !ws['!ref']) continue; const hr = headerRow(ws); if (hr >= 0) { best = { ws, hr, name: n }; break; } }
  if (!best) return null;
  const { ws, hr } = best, rng = XL.utils.decode_range(ws['!ref']);

  for (let c = rng.s.c; c <= rng.e.c; c++) { const cell = ws[XL.utils.encode_cell({ r: hr, c })]; cols[c] = cell ? fieldFor(String(cell.v)) : null; }
  const out = [];
  for (let r = hr + 1; r <= rng.e.r; r++) {
    const o = { row: r + 1 };
    for (let c = rng.s.c; c <= rng.e.c; c++) { const f = cols[c]; if (!f || f === 'capa') continue; o[f] = xlsxCellText(XL, ws[XL.utils.encode_cell({ r, c })], f); }
    if (o.nome || o.tipo) out.push(o);
  }
  out.tab = best.name;
  return out;
}

function qualityScan() {

  const pg = {};

  const plats = Object.values(pg).filter(g => Object.keys(g.v).length > 1).map(g => { const vs = Object.values(g.v).sort((a, b) => b.n - a.n); return { c: g.c, target: vs[0].raw, vs }; }).sort((a, b) => b.vs.reduce((s, v) => s + v.n, 0) - a.vs.reduce((s, v) => s + v.n, 0));
  const seasons = [];

async function prepCoverBlob(file) {
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 600 / bmp.width);
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(b => r(b || file), 'image/webp', 0.86));
  } catch { return file; }
}
function fileKeyOf(name) {
  return nkey(name.replace(/\.[a-z0-9]+$/i, '').replace(/[_.\-]+/g, ' ').replace(/\b(poster|cover|capa|folder|capsule|library|600x900|2x|steam)\b/gi, ' ').replace(/\(\d+\)|\s\d+$/g, ' '));
}
function matchScore(fk, it) {
  const tp = titleParts(it);
  const keys = [...new Set([tp.title, tp.base, it.en, it.nome, it.ptbr].map(nkey).filter(k => k.length >= 3))];
  let best = 0;
  for (const k of keys) {
    if (k === fk) best = Math.max(best, 100);
    else if (k.length >= 5 && fk.includes(k)) best = Math.max(best, 55 + Math.min(30, k.length));
    else if (fk.length >= 5 && k.includes(fk)) best = Math.max(best, 50 + Math.min(20, fk.length));
  }
  return best;
}
function openBulkCovers() {

    status();
  });

function pickSpin() {

  const final = pool[Math.floor(Math.random() * pool.length)];
  if (reduceMotion() || pool.length < 3) { out.innerHTML = pickCard(final, false); return; }
  pickBusy = true;
  const seq = pool.slice().sort(() => Math.random() - 0.5).slice(0, 13).filter(x => x !== final);
  seq.push(final);
  let i = 0;
  const step = () => {
    if (!out.isConnected) { pickBusy = false; return; }
    const last = i >= seq.length - 1;
    out.innerHTML = pickCard(seq[i], !last);
    if (last) { pickBusy = false; return; }
    i++;
    setTimeout(step, 55 + i * i * 2.6);
  };

function recordsHtml(pool) {
  const done = pool.filter(it => sKey(it) === 'concluido' && fimDe(it) && fimDe(it) <= todayIso());
  const cards = [];
  const card = (k, v, s, attr = '') => `<div class="rcard${attr ? ' clk' : ''}" ${attr}${attr ? ' role="button" tabindex="0"' : ''}><div class="rc-k">${esc(k)}</div><div class="rc-v">${esc(v)}</div><div class="rc-s">${esc(s)}</div></div>`;
  const group = keyFn => { const m = new Map(); done.forEach(it => { const k = keyFn(it); (m.get(k) || m.set(k, []).get(k)).push(it); }); return [...m.entries()]; };
  const top = arr => arr.sort((a, b) => b[1].length - a[1].length || String(b[0]).localeCompare(String(a[0])))[0];
  const dia = top(group(it => fimDe(it)));
  if (dia) cards.push(card('Dia mais cheio', `${dia[1].length} ${dia[1].length === 1 ? 'item' : 'itens'}`, fmtDate(dia[0]) + ' · ' + dia[1].slice(0, 2).map(it => titleParts(it).title).join(', ') + (dia[1].length > 2 ? '…' : ''), `data-drill="mes:${dia[0].slice(0, 7)}"`));
  const mes = top(group(it => fimDe(it).slice(0, 7)));
  if (mes) cards.push(card('Melhor mês', `${mes[1].length} concluídos`, `${MESES[+mes[0].slice(5, 7) - 1]} de ${mes[0].slice(0, 4)}`, `data-drill="mes:${mes[0]}"`));
  const ano = top(group(it => doneYear(it)).filter(([k]) => k !== 'sem'));
  if (ano) cards.push(card('Melhor ano', `${ano[1].length} concluídos`, `Em ${ano[0]}`, `data-drill="ano:${ano[0]}"`));
  // maior sequência de dias com atividade
  const days = new Set();
  pool.forEach(it => { [it.ini, it.fim].forEach(d => { const n = dayNum(d); if (n != null && n <= todayNum()) days.add(n); }); });
  const sorted = [...days].sort((a, b) => a - b);
  let best = { len: 0, end: 0 }, run = 0;
  sorted.forEach((d, i) => { run = i && d === sorted[i - 1] + 1 ? run + 1 : 1; if (run > best.len) best = { len: run, end: d }; });
  if (best.len) cards.push(card('Maior sequência', `${best.len} ${best.len === 1 ? 'dia' : 'dias'} seguidos`, `Terminou em ${fmtDate(isoOfDay(best.end))}`));
  // mais demorado
  const long = done.map(it => ({ it, d: dayNum(it.fim) - dayNum(it.ini) })).filter(x => !isNaN(x.d) && x.d >= 0 && it0(x.it)).sort((a, b) => b.d - a.d)[0];
  if (long) cards.push(card('Mais demorado', fmtDias(long.d), titleParts(long.it).title, `data-open="${esc(long.it.id)}"`));
  // autor mais visto
  const ac = {};

  if (!ui.mural) return '';
  const tip = `<div class="tt">${esc(titleParts(it).title)}</div><div class="tr"><span>${esc(it.tipo || '')}${it.ano && !isNoInfo(it.ano) ? ' · ' + esc(it.ano) : ''}</span><b>${esc((statusOf(it.status) || {}).id || '')}</b></div>`;
  return ` data-tip="${esc(tip)}"`;
}

// ============================================================ MAIS RECURSOS (4): último item adicionado e histórico
// "adicionado por último": itens criados no app contam como os mais novos; os da planilha, pela ordem das linhas
const addedRank = it => (it.row ? it.row : 1e10 + (it.atualizadoEm || 0));
function histDate(it) {
  const k = sKey(it);
  if (k === 'concluido') return { lbl: 'Terminou', iso: it.fim || it.ini };
  if (k === 'dropado') return { lbl: 'Largou', iso: it.fim || it.ini };
  if (k === 'andamento') return { lbl: 'Começou', iso: it.ini };
  return { lbl: 'Na fila', iso: it.ini };
}
function latestHtml(pool) {
  const list = pool.slice().sort((a, b) => addedRank(b) - addedRank(a)).slice(0, 10);
  if (!list.length) return '';
  const it = list[0], c = catOf(it.tipo), tp = titleParts(it), canW = Store.db && Store.canWrite !== false;
  const when = it.row ? `linha ${it.row} da planilha` : it.atualizadoEm ? `adicionado ${ago(it.atualizadoEm)}` : 'adicionado agora há pouco';
  const k = sKey(it), dd = doneDays(it);
  const dl = [];
  if (it.ini) dl.push(`Começou em ${fmtDate(it.ini)}${k === 'andamento' && it.ini <= todayIso() ? ` (${fmtAgo(todayNum() - dayNum(it.ini))})` : ''}`);
  if (it.fim) dl.push(`${k === 'dropado' ? 'Largou' : 'Terminou'} em ${fmtDate(it.fim)}`);
  if (dd != null) dl.push(dd === 0 ? 'no mesmo dia' : `levou ${fmtDias(dd)}`);
  // movimento dos últimos 7 dias (preenche a base do destaque)
  const t0 = todayNum(), within = iso => { const n = dayNum(iso); return n != null && n <= t0 && t0 - n < 7; };
  const w7 = [
    [pool.filter(x => within(x.ini)).length, 'começados'],
    [pool.filter(x => sKey(x) === 'concluido' && within(x.fim)).length, 'concluídos'],
    [pool.filter(x => sKey(x) === 'dropado' && within(x.fim)).length, 'dropados'],
    [pool.filter(x => sKey(x) === 'andamento').length, 'em andamento agora'],
  ];
  const row = (x, i) => {
    const h = histDate(x), st = statusOf(x.status), dur = doneDays(x);
    return `<li class="tl-row st-${st ? st.key : 'fila'}" style="--i:${i}" data-open="${esc(x.id)}" role="button" tabindex="0" aria-label="${esc(titleParts(x).title)}, ${esc(st ? st.id : 'sem status')}"><span class="tl-dot" aria-hidden="true"></span><div class="tl-cv">${coverHtml(x)}</div><div class="tl-t"><b>${esc(titleParts(x).title)}${i === 0 ? '<em class="tl-new">novo</em>' : ''}</b><small>${esc([x.tipo, x.plataforma && !isNoInfo(x.plataforma) ? x.plataforma : ''].filter(Boolean).join(' · '))}</small></div><div class="tl-s">${spill(x)}<small>${h.iso ? esc(h.lbl + ' ' + fmtDate(h.iso)) : esc(h.lbl)}${dur != null && dur > 0 ? ' · ' + esc(fmtDias(dur)) : ''}</small></div></li>`;
  };
  return `<div class="glow-wrap lt-glow" aria-hidden="true"><div class="feat-glow">${coverHtml(it)}</div></div>
  <div class="latest">
    <div class="lt-main">
      <div class="lt-eyebrow"><i class="ping" aria-hidden="true"></i>Último item adicionado<span>· ${esc(when)}</span></div>
      <div class="lt-body">
        <div class="feat-cv lt-cv" data-open="${esc(it.id)}" role="button" tabindex="0" aria-label="Abrir ${esc(tp.title)}">${coverHtml(it)}</div>
        <div class="lt-info">
          <span class="ttag" style="--tc:${catColor(c)}"><i></i>${esc(it.tipo || '')}</span>
          <h2 class="${it.companhia ? 'comp' : ''}">${esc(tp.title)}${tp.sfx ? ` <small>${esc(tp.sfx)}</small>` : ''}</h2>
          ${tp.sub ? `<div class="sub">${esc(tp.sub)}</div>` : ''}
          <div class="lt-meta">${esc([isNoInfo(it.ano) ? '' : it.ano, it.autor && !isNoInfo(it.autor) ? it.autor : ''].filter(Boolean).join(' · '))}</div>
          <div class="lt-pills">${spill(it)}${it.plataforma && !isNoInfo(it.plataforma) ? platHtml(it.plataforma) : ''}${it.imdb ? `<span class="star">${esc(it.imdb)}</span>` : ''}${avalHtml(parseAval(it.aval))}</div>
          ${dl.length ? `<div class="lt-dates">${esc(dl.join(' · '))}</div>` : ''}
          <div class="btnrow"><button class="btn primary" type="button" data-open="${esc(it.id)}">Abrir</button>${canW && k === 'andamento' ? `<button class="btn" type="button" data-quick="${esc(it.id)}|Concluído">Terminei</button><button class="btn ghost" type="button" data-quick="${esc(it.id)}|Dropado">Larguei</button>` : ''}</div>
        </div>
      </div>
      <div class="lt-stats"><div class="lts-h">Últimos 7 dias</div><div class="lts-g">${w7.map(([n, l]) => `<div><b>${fmtInt(n)}</b><span>${esc(l)}</span></div>`).join('')}</div></div>
    </div>
    <div class="lt-hist">
      <div class="lt-hh"><div><h3>Histórico</h3><p>Os últimos ${list.length} itens adicionados</p></div><button class="tview" type="button" data-go="recentes">Ver tudo</button></div>
      <ol class="tl">${list.map(row).join('')}</ol>
    </div>
  </div>`;
}

// ------------------------------------------------------------ início
(async function init() {
  const hv = location.hash.slice(1);
  if (['dashboard', 'planilha', 'capas'].includes(hv)) ui.view = hv;
  render();
  Store.init();
  try {
    const r = await fetch('dados.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    SNAP = await r.json();
    if (!baseMeta) base = SNAP.itens.map(expand);
  } catch (e) {
    $('#view').innerHTML = `<div class="empty"><b>Não consegui carregar os dados</b>Recarregue a página. (${esc(e.message)})</div>`;
    return;
  }
  rebuild();
  if (!ui.year) { const cy = String(new Date().getFullYear()); ui.year = items.some(it => yearOf(it) === cy) ? cy : 'all'; saveUi(); }
  loaded = true;
  render();
})();

</script>
